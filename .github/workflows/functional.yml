name: 功能与词典检查

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary:
    name: 脚本与词典检查
    runs-on: ubuntu-24.04
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
      - name: 安装脚本依赖
        run: bun install --cwd scripts --frozen-lockfile
      - name: 核对全部版本号
        run: bun scripts/version.ts --check
      - name: 检查发布脚本
        run: bun test scripts/benchmark-latency.test.ts scripts/version.test.ts
      - name: 检查冰雪键道的全部拼音音节编码
        run: bun scripts/check-pinyin-dict.ts
  test:
    name: 冰雪键道
    runs-on: ubuntu-24.04
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装 Mira
        run: |
          wget https://github.com/rimeinn/mira/releases/download/latest/mira
          chmod +x mira
      - name: 冰雪键道
        run: |
          cp deps/rime-radical-pinyin/radical_pinyin.{schema,dict}.yaml .
          ./mira -C build spec/snow_jiandao.test.yaml
