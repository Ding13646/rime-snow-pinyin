  - xform/iu(\d)$/Ⓠ$1/
  - xform/(.)ei(\d)$/$1Ⓦ$2/
  - xform/uan(\d)$/Ⓡ$1/
  - xform/[uv]e(\d)$/Ⓣ$1/
  - xform/un(\d)$/Ⓨ$1/
  - xform/^sh/Ⓤ/
  - xform/^ch/Ⓘ/
  - xform/^zh/Ⓥ/
  - xform/uo(\d)$/Ⓞ$1/
  - xform/ie(\d)$/Ⓟ$1/
  - xform/(.)i?ong(\d)$/$1Ⓢ$2/
  - xform/ing(\d)$/Ⓚ$1/
  - xform/uai(\d)$/Ⓚ$1/
  - xform/(.)ai(\d)$/$1Ⓓ$2/
  - xform/(.)eng(\d)$/$1Ⓖ$2/
  - xform/(.)en(\d)$/$1Ⓕ$2/
  - xform/[iu]ang(\d)$/Ⓛ$1/
  - xform/(.)ang(\d)$/$1Ⓗ$2/
  - xform/ian(\d)$/Ⓜ$1/
  - xform/(.)an(\d)$/$1Ⓙ$2/
  - xform/(.)ou(\d)$/$1Ⓩ$2/
  - xform/[iu]a(\d)$/Ⓧ$1/
  - xform/iao(\d)$/Ⓝ$1/
  - xform/(.)ao(\d)$/$1Ⓒ$2/
  - xform/ui(\d)$/Ⓥ$1/
  - xform/in(\d)$/Ⓑ$1/
  - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwrtyuiopsdfghjklzxcvbnm/
  - xform/^(aj|ac|ad|ew|ef|oz)(\d?)$//
  - derive/^(..)(\d)$/$1/
  - derive/^(.).+(\d)$/$1$2/

# ==========================================
# 7. 键道6方案 (jd6_algebra，两键：声母键+韵母键，声调被吸收)
# 与简拼棱镜的两键大写韵母派生（derive/^(.)(.)$）兼容。
# ==========================================
jd6:
  # 1. 全拼还原
  - xlit/ê/e/
  - xform/(^| )r5(?= |$)/$1er5/ # 儿化轻声并入 er5，避免占用单键 r
  - xform/(?<=[jqxy])u(e?\d?)/v$1/
  - xform/(^| )([aoe]|[mn]g?\d)/$1X$2/

  # 2. 声母飞键
  - xform/zh(an|ang|ei|en|eng|u|un)\d?/Q$1/
  - derive/zh(ai|ao|e)\d?/Q$1/
  - xform/zh/F/
  - xform/ch(ai|an|ang|ei|en|eng|u|un)\d?/J$1/
  - derive/ch(ao|e)\d?/J$1/
  - xform/ch/W/
  - xform/sh/E/

  # 3. 韵母
  - derive/uang\d?/M/
  - xform/[iu]ang\d?/X/
  - xform/i?ong\d?/Y/
  - xform/ang\d?/P/
  - xform/(ing|uai)\d?/G/
  - xform/e?ng\d?/R/
  - xform/(ei|un)\d?/W/
  - xform/en\d?/N/
  - xform/[uv]an\d?/T/
  - xform/ian\d?/M/
  - xform/an\d?/F/
  - xform/(iu|ua)\d?/Q/
  - xform/(ie|ou)\d?/D/
  - xform/(ai|ve|ue)\d?/H/
  - xform/iao\d?/C/
  - xform/ao\d?/Z/
  - xform/(in|ui)\d?/B/
  - xform/(u?o|v)\d?/L/
  - xform/i\d?/K/
  - xform/i?a\d?/S/
  - xform/(er|u)\d?/J/

  # 4. 去掉剩余声调，统一转换为小写收尾
  - xform/\d//
  - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwertyuiopasdfghjklzxcvbnm/

