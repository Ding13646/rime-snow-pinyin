  - xform/(un|vn)\d?/Y/
  - xform/ie\d?/P/
  - xform/ai\d?/D/
  - xform/en\d?/F/
  - xform/an\d?/R/
  - xform/iu\d?/Q/
  - xform/ei\d?/W/
  - xform/[iu]a\d?/X/
  - xform/ou\d?/Z/
  - xform/ao\d?/C/
  - xform/(in|ui)\d?/B/
  - xform/uo\d?/L/
  - xform/er\d?/M/

  # 5. 单韵母
  - xform/e\d?/E/
  - xform/a\d?/X/
  - xform/o\d?/L/
  - xform/(u|v)\d?/J/
  - xform/i\d?/K/
  

  # 6. 统一转换为小写收尾
  - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwertyuiopasdfghjklzxcvbnm/

    # 声调
  - xlit/12345/viuoa/


