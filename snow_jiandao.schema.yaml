# Rime schema
# encoding: utf-8

__include: snow_pinyin.schema.yaml:/

schema:
  schema_id: snow_jiandao
  name: 冰雪键道
  version: "0.4.1"
  author:
    - 吅吅大山
    - 谭淞宸 <i@tansongchen.com>
  description: |
    单字三码起顶、词组四码起顶的双拼词顶功方案
  dependencies:
    - snow_pinyin
    - radical_pinyin
    - snow_jiandao_bihua
    - snow_jiandao_jianpin
    - snow_jiandao_chaifen

engine:
  processors:
    - lua_processor@*snow.statistics*processor
    - ascii_composer
    - lua_processor@*snow.url
    - lua_processor@*snow.shape_processor
    - lua_processor@*snow.ss*processor
    - lua_processor@*snow.select_character
    - lua_processor@*snow.popping
    - recognizer
    - lua_processor@*snow.user_dict
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@stroke
    - affix_segmentor@pinyin
    - affix_segmentor@jianpin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - script_translator@jianpin
    - table_translator@stroke
    - table_translator@radical
    - script_translator@pinyin
    - lua_translator@*snow.buffered
    - lua_translator@*snow.datetime
    - lua_translator@*snow.statistics*translator
    - lua_translator@*snow.number
    - lua_translator@*snow.unicode*translator
    - lua_translator@*snow.calculator
    - history_translator@history
  filters:
    - lua_filter@*snow.placeholder
    - lua_filter@*snow.bihua
    - lua_filter@*snow.enforce
    - reverse_lookup_filter@lookup_pinyin
    - reverse_lookup_filter@lookup_jiandao
    - lua_filter@*snow.fix
    - lua_filter@*snow.shape_filter
    - lua_filter@*snow.postpone
    - uniquifier
    - simplifier
    - lua_filter@*snow.hint
    - lua_filter@*snow.unicode*filter
    - lua_filter@*snow.ss*filter

speller:
  alphabet: bpmfdtnlgkhjqxzcsrwyeaiouAIOUBPMFDTNLGKHJQXZCSRWYE
  initials: bpmfdtnlgkhjqxzcsrwye
  delimiter: " "
  shape:
    # 整句模式下 avuio 参与筛选
    - match: "^[bpmfdtnlgkhjqxzcsrywe]*$"
      accept: "[viuoa]"
    - match: "(?:[bpmfdtnlgkhjqxzcsrywe][BPMFDTNLGKHJQXZCSRYWE]?){3,}[viuoa]*"
      accept: "[viuoa]"
    - match: "[bpmfdtnlgkhjqxzcsrywe]{2,4}[viuoa]*"
      accept: "[viuoa]"
    - match: "[bpmfdtnlgkhjqxzcsrywe][viuoa]*"
      accept: "[viuoa]"
  popping:
    # 单字、二字词、三字词（jd6 声调被吸收，无 630 尾形态）
    - when: popping
      match: "(?:[bpmfdtnlgkhjqxzcsrywe][BPMFDTNLGKHJQXZCSRYWE]?){1,3}[BPMFDTNLGKHJQXZCSRYWE]*"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 四字词和多字词
    - when: popping
      match: "(?:[bpmfdtnlgkhjqxzcsrywe][BPMFDTNLGKHJQXZCSRYWE]?){4,}[BPMFDTNLGKHJQXZCSRYWE]*"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 已有至少四个声母时，大写转成小写追加下一个字的声母
    - when: popping
      match: "(?:[bpmfdtnlgkhjqxzcsrywe][BPMFDTNLGKHJQXZCSRYWE]?){4,}[BPMFDTNLGKHJQXZCSRYWE]*"
      accept: "[BPMFDTNLGKHJQXZCSRYWE]"
      strategy: append
    # 不足四个声母时，大写原样追加为前一个字的韵母
    - when: popping
      match: "(?:[bpmfdtnlgkhjqxzcsrywe][BPMFDTNLGKHJQXZCSRYWE]?){0,2}[bpmfdtnlgkhjqxzcsrywe]"
      accept: "[BPMFDTNLGKHJQXZCSRYWE]"
      strategy: append_raw
    # 顶标点
    - match: ".*[^a-zA-Z0-9]"
      accept: "[bpmfdtnlgkhjqxzcsrywe]"
    # 标点大写顶
    - match: ".*[a-z0-9]"
      accept: "[^a-z0-9 ]"
  algebra:
    __include: snow_algebra.yaml:/jd6
    __append:
      # 英数字母的音节码；改动时 snow_jiandao_jianpin 的 algebra 要跟着改
      - xform/~{1,2}([bpmfdtnlgkhjqxzcsrywe])/$1e/
      - xform/~{1,2}v/xh/
      - xform/~{1,2}i/xk/
      - xform/~{1,2}u/xj/
      - xform/~{1,2}o/xl/
      - xform/~{1,2}a/xs/
      - xform/[viuoa]$// # 无声调

jianpin:
  tag: jianpin
  dictionary: rime_frost
  prism: snow_jiandao_jianpin

lookup_jiandao:
  tags: [pinyin]
  overwrite_comment: true
  dictionary: rime_frost
  comment_format:
    - "xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/"
    - "xform/(?<=[jqxy])u(e?\d?)/v$1/"
    - "xform/(^| )([aoe]|[mn]g?\d)/$1C$2/"
    - "xform/zh/W/"
    - "xform/sh/E/"
    - "xform/ch/F/"
    - "xform/iang\d?/F/"
    - "xform/uang\d?/M/"
    - "xform/i?ong\d?/S/"
    - "xform/iao\d?/N/"
    - "xform/uai\d?/P/"
    - "xform/(uan|van)\d?/T/"
    - "xform/ing\d?/L/"
    - "xform/eng\d?/G/"
    - "xform/ang\d?/H/"
    - "xform/ian\d?/M/"
    - "xform/(ve|ue)\d?/R/"
    - "xform/(un|vn)\d?/Y/"
    - "xform/ie\d?/P/"
    - "xform/ai\d?/D/"
    - "xform/en\d?/F/"
    - "xform/an\d?/R/"
    - "xform/iu\d?/Q/"
    - "xform/ei\d?/W/"
    - "xform/[iu]a\d?/X/"
    - "xform/ou\d?/Z/"
    - "xform/ao\d?/C/"
    - "xform/(in|ui)\d?/B/"
    - "xform/uo\d?/L/"
    - "xform/er\d?/M/"
    - "xform/e\d?/E/"
    - "xform/a\d?/X/"
    - "xform/o\d?/L/"
    - "xform/(u|v)\d?/J/"
    - "xform/i\d?/K/"
    - "xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwertyuiopasdfghjklzxcvbnm/"
    - "xlit/12345/viuoa/"
    - "xform/[viuoa]$//"
    __include: snow_algebra.yaml:/jd6
    __append:
      - xform/q([zhe])/f$1/
      - xform/[viuoa]( |$)/$1/ # 无声调

__patch:
  - patch
  - snow_jiandao.custom:/patch?

patch:
  switches:
    __include: snow_pinyin.schema.yaml:/switches
    __append:
      - name: popping
        states: [整句, 顶功]
        reset: 1
      - name: chaifen
        states: [默认, 拆分]
        reset: 0
      - name: buffered
        states: [结束, 缓冲]
        reset: 0
      - name: unicode
        states: [隐藏, 注解]
        reset: 0
      - name: add
        states: [结束, 加词]
        reset: 0
      - name: ss
        states: [关闭, 开启]
        reset: 1
  translator/prism: snow_jiandao
  translator/preedit_format: null
  translator/enable_schema_user_dict: true
  translator/shape_elements: snow_jiandao_chaifen
  translator/shape_mapping: "radical_jiandao.txt"
  key_binder:
    bindings:
      __include: snow_pinyin.schema.yaml:/key_binder/bindings
      __append:
        - { when: always, accept: "Control+j", toggle: buffered }
        - { when: always, accept: "Control+u", toggle: unicode }
        - { when: always, accept: "Control+t", toggle: chaifen }
        - { when: always, accept: "Control+Shift+s", toggle: ss }
  menu/alternative_select_keys: null
  recognizer/patterns/punct: '^/([0-9]0?|[A-Za-z]+)$'
  recognizer/patterns/pinyin: "^a[a-z]*'?$"
  recognizer/patterns/stroke: "^u[a-z]*'?$"
  recognizer/patterns/lua: "^o.*$"
  recognizer/patterns/history: "^i$"
  stroke/prefix: u
  radical/prefix: u
  pinyin/prefix: a
  history/input: i
  lua/input: o
  recognizer/patterns/jianpin: "^(?:[bpmfdtnlgkhjqxzcsrywe][BPMFDTNLGKHJQXZCSRYWE]?){3,}$"
  recognizer/patterns/url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"
  stroke/prism: snow_jiandao_bihua
  stroke/preedit_format: [xlit/viuoa/一丨丿丶乙/]
  __include: grammar:/hans # 八股文模型
