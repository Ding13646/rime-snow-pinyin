# Rime schema
# encoding: utf-8

__include: snow_pinyin.schema.yaml:/

schema:
  schema_id: snow_jiandao_jianpin
  name: 冰雪键道简拼
  version: "0.4.0"
  author:
    - 吅吅大山
    - 谭淞宸 <i@tansongchen.com>
  description: |
    用于辅助键道实现，非常规方案
  dependencies:
    - snow_pinyin

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - history_translator
  filters:
    - uniquifier
    - simplifier

speller:
  alphabet: bpmfdtnlgkhjqxzcsrwye
  delimiter: " '"
  algebra:
    __include: snow_jiandao_algebra.yaml:/jiandao_algebra
    __append:
      # 英数字母的伪音节（`~x` / `~~x`）也要缩得出声母，否则英数混输造出来的词
      # 在声母编码下查不到。键道的字母音节码是 `<声>e` / `x<韵>`，改动字母规则时
      # 这里要跟着改
      - xform/~{1,2}([bpmfdtnlgkhjqxzcsrywe])/$1e/
      - xform/~{1,2}v/xh/
      - xform/~{1,2}i/xk/
      - xform/~{1,2}u/xj/
      - xform/~{1,2}o/xl/
      - xform/~{1,2}a/xs/
      # 声母后可接大写韵母，供三字及以上词补韵母
      - derive/^(.)(.)[viuoa]$/$1\u$2/
      - derive/.([viuoa])$/?$1/ # 无韵母
      - xform/^([bpmfdtnlgkhjqxzcsrywe])[bpmfdtnlgkhjqxzcsrywe][viuoa]?$/$1/ # 简拼，保留带大写韵母的拼写
      - derive/^.+$/~/ # 通配符

__patch:
  - patch
  - snow_jiandao_jianpin.custom:/patch?

patch:
  translator/prism: snow_jiandao_jianpin
