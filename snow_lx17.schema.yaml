# Rime schema
# encoding: utf-8

__include: snow_pinyin.schema.yaml:/

schema:
  schema_id: snow_lx17
  name: 冰雪林氏17
  version: "0.4.1"
  author:
    - 吅吅大山
    - 谭淞宸 <i@tansongchen.com>
  description: |
    林氏17 双拼的顶功方案，保留简拼与声声词
  dependencies:
    - snow_pinyin
    - snow_bihua
    - radical_pinyin
    - snow_jiandao_bihua
    - snow_lx17_jianpin
    - snow_jiandao_chaifen

engine:
  processors:
    - lua_processor@*snow.statistics*processor
    - ascii_composer
    - lua_processor@*snow.url
    - lua_processor@*snow.shape_processor
    - lua_processor@*snow.ss*processor
    - lua_processor@*snow.select_character
    - lua_processor@*snow.popping
    - recognizer
    - lua_processor@*snow.user_dict
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@stroke
    - affix_segmentor@pinyin
    - affix_segmentor@jianpin
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - script_translator@jianpin
    - table_translator@stroke
    - table_translator@radical
    - script_translator@pinyin
    - lua_translator@*snow.buffered
    - lua_translator@*snow.datetime
    - lua_translator@*snow.statistics*translator
    - lua_translator@*snow.number
    - lua_translator@*snow.unicode*translator
    - lua_translator@*snow.calculator
    - history_translator@history
  filters:
    - lua_filter@*snow.placeholder
    - lua_filter@*snow.bihua
    - lua_filter@*snow.enforce
    - reverse_lookup_filter@lookup_pinyin
    - reverse_lookup_filter@lookup_lx17
    - lua_filter@*snow.fix
    - lua_filter@*snow.shape_filter
    - lua_filter@*snow.postpone
    - uniquifier
    - simplifier
    - lua_filter@*snow.unicode*filter
    - lua_filter@*snow.ss*filter

speller:
  alphabet: bcdfghjlmnpqstwxyzaiouBCDFGHJLMNPQSTWXYZ
  initials: bcdfghjlmnpqstwxyz
  delimiter: " "
  shape:
    # 整句模式下辅助码键参与筛选
    - match: "^[bcdfghjlmnpqstwxyz]*$"
      accept: "[avuio]"
  popping:
    # 三字词补韵母：仅限 7 种形态，形态本身不含顶屏字母。
    # 形态后再输入一个小写声母即顶屏，accept 接这个小写声母。
    # 必须放在最前，避免被「单字和三字词」等宽规则抢先匹配。
    - when: popping
      match: "[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ][bcdfghjlmnpqstwxyz]{2}"
      accept: "[bcdfghjlmnpqstwxyz]"
    - when: popping
      match: "[bcdfghjlmnpqstwxyz]{2}[BCDFGHJLMNPQSTWXYZ][bcdfghjlmnpqstwxyz]"
      accept: "[bcdfghjlmnpqstwxyz]"
    - when: popping
      match: "[bcdfghjlmnpqstwxyz]{3}[BCDFGHJLMNPQSTWXYZ]"
      accept: "[bcdfghjlmnpqstwxyz]"
    - when: popping
      match: "[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ][bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ][bcdfghjlmnpqstwxyz]"
      accept: "[bcdfghjlmnpqstwxyz]"
    - when: popping
      match: "[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ][bcdfghjlmnpqstwxyz]{2}[BCDFGHJLMNPQSTWXYZ]"
      accept: "[bcdfghjlmnpqstwxyz]"
    - when: popping
      match: "[bcdfghjlmnpqstwxyz]{2}[BCDFGHJLMNPQSTWXYZ][bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ]"
      accept: "[bcdfghjlmnpqstwxyz]"
    - when: popping
      match: "[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ][bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ][bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ]"
      accept: "[bcdfghjlmnpqstwxyz]"
    # 单字和三字词
    - when: popping
      match: "(?:[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ]?){2,3}[BCDFGHJLMNPQSTWXYZ]*"
      accept: "[bcdfghjlmnpqstwxyz]"
    # 四字词和多字词
    - when: popping
      match: "(?:[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ]?){4,}[BCDFGHJLMNPQSTWXYZ]*"
      accept: "[bcdfghjlmnpqstwxyz]"
    # 已有至少四个声母时，大写转成小写追加下一个字的声母；韵母和形码不计数
    - when: popping
      match: "(?:[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ]?){4,}[BCDFGHJLMNPQSTWXYZ]*"
      accept: "[BCDFGHJLMNPQSTWXYZ]"
      strategy: append
    # 不足四个声母时，大写原样追加为前一个字的韵母
    - when: popping
      match: "(?:[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ]?){0,2}[bcdfghjlmnpqstwxyz]"
      accept: "[BCDFGHJLMNPQSTWXYZ]"
      strategy: append_raw
    # 顶标点
    - match: ".*[^a-zA-Z0-9]"
      accept: "[bcdfghjlmnpqstwxyz]"
    # 标点大写顶
    - match: ".*[a-z0-9]"
      accept: "[^a-z0-9 ]"
  algebra:
    __include: snow_algebra.yaml:/lx17

jianpin:
  tag: jianpin
  dictionary: rime_frost
  prism: snow_lx17_jianpin

lookup_lx17:
  tags: [pinyin]
  overwrite_comment: true
  dictionary: rime_frost
  comment_format:
    __include: snow_algebra.yaml:/lx17

__patch:
  - patch
  - snow_lx17.custom:/patch?

patch:
  switches:
    __include: snow_pinyin.schema.yaml:/switches
    __append:
      - name: popping
        states: [整句, 顶功]
        reset: 1
      - name: chaifen
        states: [默认, 拆分]
        reset: 0
      - name: buffered
        states: [结束, 缓冲]
        reset: 0
      - name: unicode
        states: [隐藏, 注解]
        reset: 0
      - name: add
        states: [结束, 加词]
        reset: 0
      - name: ss
        states: [关闭, 开启]
        reset: 1
  key_binder:
    bindings:
      __include: snow_pinyin.schema.yaml:/key_binder/bindings
      __append:
        - { when: always, accept: "Control+j", toggle: buffered }
        - { when: always, accept: "Control+u", toggle: unicode }
        - { when: always, accept: "Control+t", toggle: chaifen }
        - { when: always, accept: "Control+Shift+s", toggle: ss }
  translator/prism: snow_lx17
  translator/preedit_format: null
  translator/enable_schema_user_dict: true
  translator/shape_elements: snow_jiandao_chaifen
  translator/shape_mapping: "radical_jiandao.txt"
  menu/alternative_select_keys: null
  recognizer/patterns/punct: '^/([0-9]0?|[A-Za-z]+)$'
  recognizer/patterns/pinyin: '^aA[a-z]*''?$'
  recognizer/patterns/stroke: '^uU[a-z]*''?$'
  recognizer/patterns/lua: '^oO.*$'
  recognizer/patterns/history: '^iI$'
  stroke/prefix: uU
  radical/prefix: uU
  pinyin/prefix: aA
  history/input: iI
  lua/input: oO
  recognizer/patterns/jianpin: "^(?:[bcdfghjlmnpqstwxyz][BCDFGHJLMNPQSTWXYZ]?){3,}$"
  recognizer/patterns/url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"
  stroke/prism: snow_jiandao_bihua
  stroke/preedit_format: [xlit/viuoa/一丨丿丶乙/]
