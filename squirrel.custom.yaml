#使用之前请详细遍历每一行，都注释了功能点，看清楚是不是你要的，需不需要修改参数，哪些该留，哪些该删除，够语重心长了吧😄
patch:
  style/color_scheme: apathy # phub 淺色主题
  style/color_scheme_dark: apathy #  深色主题
  preset_color_schemes/apathy/hilited_text_color: 0x999999            # 高亮拼音 (需要开启内嵌编码)
  preset_color_schemes/apathy/hilited_candidate_back_color: 0x32A14C  # 第一候选项背景色
  preset_color_schemes/apathy/hilited_candidate_text_color: 0xFFFFFF  # 第一候选项文字颜色
  preset_color_schemes/apathy/hilited_candidate_label_color: 0xFFFFFF # 第一候选项编号颜色
  preset_color_schemes/apathy/hilited_comment_text_color: 0x000000    # 注解文字高亮
  preset_color_schemes/apathy/comment_text_color: 0x999999  #拼音等提示文字颜色
